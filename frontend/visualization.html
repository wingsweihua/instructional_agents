<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADDIE Pipeline Visualization - Instructional Agents</title>
  <link rel="stylesheet" href="visualization.css">
</head>
<body>

  <!-- Header -->
  <header class="viz-header">
    <h1>Instructional Agents</h1>
    <p class="viz-subtitle">ADDIE Multi-Agent Collaboration Pipeline</p>
  </header>

  <!-- Phase Banner -->
  <div class="phase-banner" id="phaseBanner">
    <span class="phase-label" id="phaseLabel">Phase 1: Foundation Deliberations</span>
    <span class="task-label" id="taskLabel">Instructional Goals Definition</span>
  </div>

  <!-- Classroom Stage -->
  <section class="stage-container">
    <div class="stage" id="stage">
      <img class="stage-bg" src="assets/icons/background.png" alt="Classroom">
      <!-- Agent sprites (injected by JS) -->
      <!-- Speech bubbles (injected by JS) -->
      <!-- Data particles (injected by JS) -->

      <!-- Context stack (bottom-right) -->
      <div class="context-stack" id="contextStack"></div>

      <!-- Action description overlay -->
      <div class="action-overlay" id="actionOverlay"></div>
    </div>
  </section>

  <!-- Playback Controls -->
  <section class="controls-bar" id="controlsBar">
    <div class="controls-group">
      <button class="ctrl-btn" id="btnStepBack" title="Previous step (Left arrow)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn ctrl-btn--play" id="btnPlayPause" title="Play/Pause (Space)">
        <svg class="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
      </button>
      <button class="ctrl-btn" id="btnStepForward" title="Next step (Right arrow)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm10-12v12h2V6z"/></svg>
      </button>
    </div>
    <div class="speed-group">
      <span class="speed-label">Speed</span>
      <button class="speed-btn" data-speed="0.5">0.5x</button>
      <button class="speed-btn active" data-speed="1">1x</button>
      <button class="speed-btn" data-speed="2">2x</button>
      <button class="speed-btn" data-speed="4">4x</button>
    </div>
    <div class="progress-text" id="progressText">Step 0 / 0</div>
  </section>

  <!-- Pipeline Timeline -->
  <section class="timeline-section">
    <div class="timeline-scroll">
      <div class="timeline" id="timeline">
        <!-- Generated by JS -->
      </div>
    </div>
  </section>

  <!-- Detail Panel -->
  <section class="detail-panel" id="detailPanel">
    <div class="detail-inner">
      <h3 class="detail-title" id="detailTitle">Select a task to view details</h3>
      <div class="detail-agents" id="detailAgents"></div>
      <div class="detail-description" id="detailDescription"></div>
      <div class="detail-output" id="detailOutput"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="viz-footer">
    <p>Instructional Agents &mdash; Multi-Agent Collaboration for Automated Course Material Generation</p>
  </footer>

  <script src="visualization.js"></script>
</body>
</html>
